name: probe-blas

# Throwaway. Answers one question: does forcing OPENBLAS_CORETYPE make different runners agree on
# the output of the eigensolver that FastSurfer's spherical projection uses?
#
# Background: the first divergence between two quicktest runs is lh.qsphere.nofix, produced by
# recon_surf/spherically_project_wrapper.py, which calls lapy's Solver.eigs through scipy. The numpy
# and scipy wheels ship OpenBLAS built with DYNAMIC_ARCH, so it picks a kernel from the CPU at
# runtime. On one machine, forcing a different core type moved the projection by 5.9e-05, the same
# order as the 7.2e-05 seen between two runners. What is not yet known is whether forcing the same
# core type on different machines makes them agree, which is the only thing that would make the fix
# worth shipping.
#
# No FastSurfer image and no brain data: a deterministic synthetic mesh through the same solver call
# exercises the same path in a couple of minutes.
#
# Delete the branch once it has answered. Nothing here is meant to reach dev.

on:
  push:
    branches: [probe-blas]

permissions:
  contents: read

jobs:
  probe:
    name: 'sample ${{ matrix.sample }}'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2, 3, 4, 5, 6, 7, 8]

    steps:
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          # the version the image carries
          python-version: '3.12'

      - name: Install the numerical stack the image has
        run: pip install numpy==2.5.3 scipy==1.18.1 nibabel==5.4.2 lapy==1.6.0

      - name: Write the probe
        shell: bash
        run: |
          cat > /tmp/probe.py <<'PY'
          import hashlib
          import json
          import sys
          import time

          import numpy as np
          from lapy import Solver, TriaMesh


          def icosphere(subdivisions):
              """A deterministic mesh, built without transcendentals or BLAS."""
              t = (1.0 + 5.0 ** 0.5) / 2.0
              v = np.array([
                  [-1, t, 0], [1, t, 0], [-1, -t, 0], [1, -t, 0],
                  [0, -1, t], [0, 1, t], [0, -1, -t], [0, 1, -t],
                  [t, 0, -1], [t, 0, 1], [-t, 0, -1], [-t, 0, 1],
              ], dtype=np.float64)
              f = np.array([
                  [0, 11, 5], [0, 5, 1], [0, 1, 7], [0, 7, 10], [0, 10, 11],
                  [1, 5, 9], [5, 11, 4], [11, 10, 2], [10, 7, 6], [7, 1, 8],
                  [3, 9, 4], [3, 4, 2], [3, 2, 6], [3, 6, 8], [3, 8, 9],
                  [4, 9, 5], [2, 4, 11], [6, 2, 10], [8, 6, 7], [9, 8, 1],
              ], dtype=np.int64)
              for _ in range(subdivisions):
                  points = list(v)
                  mid = {}
                  faces = []
                  for a, b, c in f:
                      m = []
                      for x, y in ((a, b), (b, c), (c, a)):
                          key = (min(x, y), max(x, y))
                          if key not in mid:
                              mid[key] = len(points)
                              points.append((points[x] + points[y]) / 2.0)
                          m.append(mid[key])
                      faces += [[a, m[0], m[2]], [b, m[1], m[0]],
                                [c, m[2], m[1]], [m[0], m[1], m[2]]]
                  v = np.array(points, dtype=np.float64)
                  f = np.array(faces, dtype=np.int64)
              # normalise without np.linalg.norm, which would go through BLAS and could make the
              # input itself depend on the kernel
              v = v / np.sqrt((v * v).sum(axis=1))[:, None]
              # An exact sphere has repeated eigenvalues, and degenerate eigenvectors are not
              # unique, so they would vary for reasons that have nothing to do with the kernel.
              # Break the symmetry with an ellipsoid plus a polynomial bump: multiplies and adds
              # only, so the mesh is bit identical on every host.
              v = v * np.array([1.0, 0.82, 0.63])
              v[:, 2] += 0.07 * (v[:, 0] ** 3 - 0.5 * v[:, 0])
              return v, f


          def digest(a):
              return hashlib.md5(np.ascontiguousarray(a).tobytes()).hexdigest()[:12]


          # 7 subdivisions gives 163842 vertices, the same order as a real cortical surface
          # (136112 on the quicktest subject). Size matters here: a larger problem accumulates more
          # rounding, so a small mesh could agree across kernels where the real one does not.
          t0 = time.perf_counter()
          points, trias = icosphere(7)
          t_mesh = time.perf_counter() - t0

          mesh = TriaMesh(points, trias)

          # the same call spherically_project.py makes: lump=False, no cholmod (the image has no
          # scikit-sparse), k=4, seeded
          t0 = time.perf_counter()
          fem = Solver(mesh, lump=False, use_cholmod=False)
          evals, evecs = fem.eigs(k=4, rng=0)
          t_solve = time.perf_counter() - t0

          # Eigenvectors carry a sign ambiguity, so canonicalise before hashing or the fingerprint
          # would differ for a reason that is not about arithmetic.
          for i in range(evecs.shape[1]):
              col = evecs[:, i]
              if col[np.argmax(np.abs(col))] < 0:
                  evecs[:, i] = -col

          def numpy_simd():
              """The SIMD extensions numpy dispatches to, which is separate from BLAS."""
              import contextlib
              import io
              import re
              buf = io.StringIO()
              with contextlib.redirect_stdout(buf):
                  np.show_runtime()
              m = re.search(r"'found': \[(.*?)\]", buf.getvalue(), re.S)
              if not m or not m.group(1).strip():
                  return []
              return [f.strip().strip("'\"") for f in m.group(1).split(",") if f.strip()]


          gaps = np.diff(np.sort(evals))
          print(json.dumps({
              "nvert": int(points.shape[0]),
              # the mesh is built with numpy only and never touches BLAS, so this digest isolates
              # numpy's own SIMD dispatch from the eigensolver's BLAS dispatch
              "mesh": digest(points),
              "numpy_simd": numpy_simd(),
              # the solve is what the pin would slow down; the mesh is probe scaffolding but is
              # still a fair sample of ordinary numpy work
              "t_mesh": round(t_mesh, 3),
              "t_solve": round(t_solve, 3),
              "evals": [float(x) for x in evals],
              "evals_digest": digest(evals),
              "evecs_digest": digest(evecs),
              # if two eigenvalues are nearly equal their eigenvectors are not well determined and
              # the comparison below means nothing, so report the separation
              "min_gap": float(gaps.min()) if gaps.size else 0.0,
          }))
          PY

      - name: Probe
        shell: bash
        env:
          SAMPLE: ${{ matrix.sample }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys


          def run(**env):
              p = subprocess.run([sys.executable, "/tmp/probe.py"],
                                 env={**os.environ, **env}, capture_output=True, text=True)
              if p.returncode != 0:
                  raise SystemExit(f"probe failed with {env}:\n{p.stderr}")
              return json.loads(p.stdout)


          def openblas_core(**env):
              """Which kernel OpenBLAS selects, the analogue of torch's CPU capability line."""
              p = subprocess.run([sys.executable, "-c", "import numpy"],
                                 env={**os.environ, "OPENBLAS_VERBOSE": "2", **env},
                                 capture_output=True, text=True)
              m = re.search(r"Core:\s*(\S+)", p.stdout + p.stderr)
              return m.group(1) if m else "unknown"


          # single threaded throughout, the way the wrapper already pins it, so thread count is
          # never the variable
          threads = {"OPENBLAS_NUM_THREADS": "1", "OMP_NUM_THREADS": "1"}

          # Both layers have to be pinned, established in the previous round. The question now is
          # how gently, and what it costs.
          #   strict: numpy down to the wheel's baseline, OpenBLAS down to Nehalem
          #   gentle: numpy left at X86_V3, OpenBLAS at Haswell
          # Gentle is the level four of the eight runners already sit at natively, so on those it
          # should be a no-op, and it should reproduce the value they produce unpinned.
          probe_default = run(**threads)
          simd = probe_default["numpy_simd"]

          strict_simd = {"NPY_DISABLE_CPU_FEATURES": " ".join(simd)} if simd else {}
          keep = "X86_V3"
          gentle_list = [f for f in simd if f != keep]
          gentle_simd = {"NPY_DISABLE_CPU_FEATURES": " ".join(gentle_list)} if gentle_list else {}

          cpuinfo = open("/proc/cpuinfo").read()
          result = {
              "sample": os.environ["SAMPLE"],
              "cpu": re.search(r"model name\s*:\s*(.+)", cpuinfo).group(1).strip(),
              "core_default": openblas_core(),
              "simd_found": simd,
              "simd_kept_by_gentle": keep if keep in simd else None,
              "default": probe_default,
              "gentle": run(**threads, **gentle_simd, OPENBLAS_CORETYPE="Haswell"),
              "strict": run(**threads, **strict_simd, OPENBLAS_CORETYPE="Nehalem"),
          }
          print(json.dumps(result, indent=2))
          with open("/tmp/result.json", "w") as f:
              json.dump(result, f)
          PY

      - name: Upload the result
        uses: actions/upload-artifact@v7
        with:
          name: blas-${{ matrix.sample }}
          path: /tmp/result.json

  collect:
    name: 'Collate the samples'
    needs: probe
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Retrieve every sample
        uses: actions/download-artifact@v8
        with:
          pattern: blas-*
          path: /tmp/samples

      - name: Collate
        shell: bash
        run: |
          python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          rows = sorted((json.loads(p.read_text()) for p in Path("/tmp/samples").rglob("result.json")),
                        key=lambda r: int(r["sample"]))
          if not rows:
              raise SystemExit("no samples found")

          VARIANTS = [("nothing", "default"), ("gentle", "gentle"), ("strict", "strict")]

          def med(values):
              v = sorted(values)
              return v[len(v) // 2]

          print("## How gently can the pin be set, and what does it cost\n")
          print("| # | CPU | BLAS core | numpy SIMD | evecs nothing | evecs gentle | evecs strict | solve s: none/gentle/strict |")
          print("|---|-----|-----------|------------|---------------|--------------|--------------|------------------------------|")
          for r in rows:
              t = "/".join(f"{r[k]['t_solve']:.1f}" for _, k in VARIANTS)
              print(f"| {r['sample']} | {r['cpu']} | {r['core_default']} "
                    f"| {','.join(r['simd_found']) or 'none'} "
                    + " ".join(f"| `{r[k]['evecs_digest']}`" for _, k in VARIANTS)
                    + f" | {t} |")

          def verdict(label, ok, yes, no):
              print(f"\n**{label}:** {yes if ok else no}")

          worst = min(r["default"]["min_gap"] for r in rows)
          verdict("Eigenvalues well separated", worst > 1e-6,
                  f"yes, smallest gap {worst:.3e}.",
                  f"NO, smallest gap {worst:.3e}; the comparison is unreliable.")

          classes = {(r["core_default"], tuple(r["simd_found"])) for r in rows}
          if len(classes) < 2:
              print(f"\n**Only one hardware class sampled** ({classes}), so agreement below proves "
                    "nothing. Push an empty commit to draw again.")

          print("\n### Agreement\n")
          for label, key in VARIANTS:
              n = len({r[key]["evecs_digest"] for r in rows})
              print(f"- {label}: **{n}** distinct eigenvector fingerprint(s) across {len(rows)} runners")

          gentle_ok = len({r["gentle"]["evecs_digest"] for r in rows}) == 1
          strict_ok = len({r["strict"]["evecs_digest"] for r in rows}) == 1
          verdict("Gentle is enough", gentle_ok,
                  "YES, so there is no reason to go to baseline.",
                  "no, gentle still splits; strict is needed if it works at all.")
          verdict("Strict works", strict_ok, "yes.", "NO, a third dispatch layer remains.")

          # gentle should reproduce what the machines already at that level produce unpinned
          native = {r["default"]["evecs_digest"] for r in rows
                    if r["simd_kept_by_gentle"] and len(r["simd_found"]) == 1}
          if gentle_ok and native:
              g = next(iter({r["gentle"]["evecs_digest"] for r in rows}))
              verdict("Gentle reproduces the native X86_V3 result", g in native,
                      "yes, which is the expected cross-check.",
                      f"no: gentle gives {g}, the native machines give {native}. Unexpected, "
                      "so treat the agreement above with care.")

          print("\n### Cost, median eigensolve seconds across runners\n")
          base = med([r["default"]["t_solve"] for r in rows])
          for label, key in VARIANTS:
              t = med([r[key]["t_solve"] for r in rows])
              print(f"- {label}: **{t:.2f}s**" + ("" if key == "default" else
                    f", {100 * (t - base) / base:+.0f}% against nothing pinned"))
          print("\nThe projection is documented at about 23 seconds in the pipeline, so scale the "
                "percentage against that rather than against the probe's absolute numbers.")
          PY
